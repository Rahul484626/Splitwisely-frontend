<ion-content [fullscreen]="true" class="home-content">
  <div class="app-canvas home-shell">
    <header class="home-shell__brand">
      <div class="eyebrow">Expense splitting</div>
      <h1>Splitwisely</h1>
      <p class="lede">Dark-glass shell ready. API base: {{ apiBaseUrl }}</p>
    </header>

    <app-glass-card label="Overall balance" amount="+₹0" caption="You are settled up" tone="neutral" />

    <div class="home-shell__actions">
      <button type="button" class="btn-primary-gradient" disabled>Add expense</button>
      <button type="button" class="btn-ghost glass-surface" disabled>Settle up</button>
    </div>
  </div>
</ion-content>
